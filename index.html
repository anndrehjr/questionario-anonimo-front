<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8f5" />
  <meta name="referrer" content="no-referrer" />
  <title>Voto — Questionários anônimos</title>
  <meta name="description" content="Questionários anônimos para uma sala de aula mais participativa." />
  <meta property="og:title" content="Questionário anônimo" />
  <meta property="og:description" content="Sua opinião importa. Responda com segurança e anonimato." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    /* Tela de carregamento: linha no meio. Usada antes do app abrir e nas trocas de página. */
    .tela-carregando { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 22px; background: #f7f8f5; color: #1c2937; font: 600 15px Inter, system-ui, sans-serif; }
    .tela-carregando .tc-marca { display: inline-flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; letter-spacing: -1px; }
    .tela-carregando .tc-logo { width: 34px; height: 34px; border-radius: 10px; background: #2864dc url("/favicon.svg") center / cover; }
    .tela-carregando .tc-linha { position: relative; width: min(220px, 60vw); height: 3px; overflow: hidden; border-radius: 3px; background: #dfe5ee; }
    .tela-carregando .tc-linha i { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: #2864dc; animation: tc-corre 1.15s cubic-bezier(.65, 0, .35, 1) infinite; }
    .tela-carregando .tc-texto { font-size: 12px; font-weight: 500; color: #75808c; }
    @keyframes tc-corre { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .tela-carregando .tc-linha i { animation: none; width: 100%; opacity: .55; } }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tela-carregando { background: #121417; color: #e8ecf1; } :root:not([data-theme="light"]) .tela-carregando .tc-linha { background: #262b32; } :root:not([data-theme="light"]) .tela-carregando .tc-texto { color: #8d97a3; } }
    :root[data-theme="dark"] .tela-carregando { background: #121417; color: #e8ecf1; }
    :root[data-theme="dark"] .tela-carregando .tc-linha { background: #262b32; }
    :root[data-theme="dark"] .tela-carregando .tc-texto { color: #8d97a3; }

    /* Aviso "salvo" (Sakuga toast): fixo no canto; o elemento mantém o lugar enquanto está escondido. */
    sakuga-toast { position: fixed; left: 24px; bottom: 24px; z-index: 60; --sk-pri: #2864dc; --sk-soft: #c7d8f7; }
  </style>
</head>
<body>
  <div id="root">
    <div class="tela-carregando" role="status" aria-live="polite">
      <div class="tc-marca"><span class="tc-logo" aria-hidden="true"></span> voto</div>
      <div class="tc-linha" aria-hidden="true"><i></i></div>
      <span class="tc-texto">Carregando…</span>
    </div>
  </div>
  <sakuga-toast></sakuga-toast>
  <script src="/toast.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
